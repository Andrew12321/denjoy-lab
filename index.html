<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3E8EB">
<title>Meta Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel:#E3E8EB; --panel:#FFFFFF; --ink:#17202B; --slate:#66727E; --rule:#D3DADF;
    --run:#2FA866; --warn:#E8A317; --stop:#D8453B; --focus:#2F6FD6;
    --num:'Saira Semi Condensed',system-ui,sans-serif;
    --txt:'Atkinson Hyperlegible',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--steel);color:var(--ink)}
  body{font:16px/1.4 var(--txt);padding:max(12px,env(safe-area-inset-top)) 16px 16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .conn{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .led{width:12px;height:12px;border-radius:50%;background:var(--stop);box-shadow:0 0 0 4px #d8453b22;flex:none}
  .led.on{background:var(--run);box-shadow:0 0 0 4px #2fa86626}
  .led.wait{background:var(--warn);box-shadow:0 0 0 4px #e8a31726;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .conn b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conn span{color:var(--slate);font-size:14px;white-space:nowrap}
  .pill{background:var(--panel);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:inset 0 0 0 1px var(--rule)}
  .pill.primary{background:var(--ink);color:#fff;box-shadow:none}

  /* programe = culorile ISO ale acelor endodontice */
  .progs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
  .prog{background:var(--panel);border-radius:14px;padding:10px 10px 10px 18px;text-align:left;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule);min-height:64px}
  .prog::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--iso);border-right:1px solid #17202B33}
  .prog .n{font:600 22px/1 var(--num)}
  .prog .s{font:500 14px/1.2 var(--num);color:var(--slate);margin-top:4px;font-variant-numeric:tabular-nums}
  .prog.act{background:var(--ink);color:#fff;box-shadow:none}
  .prog.act .s{color:#AEB8C2}
  .prog.flash{animation:flash .45s}
  @keyframes flash{0%{transform:scale(.95)}100%{transform:none}}

  .main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;flex:1}
  .main>.panel:first-child{display:flex;flex-direction:column;justify-content:center}
  @media(max-width:760px){
    .main{grid-template-columns:1fr;flex:none}
    .dialwrap{grid-template-columns:1fr 1fr;gap:10px}
    .dial{grid-column:1/-1;grid-row:1}
    .dialwrap .step{width:100%;border-radius:18px;height:64px;grid-row:2}
    .dialwrap .step[data-sp="-50"]{grid-column:1} .dialwrap .step[data-sp="50"]{grid-column:2}
    .prog{padding:8px 6px 8px 14px;min-height:54px}
    .prog .tqx{display:none}
    .meter{min-height:160px}
  }
  .panel{background:var(--panel);border-radius:22px;padding:18px;box-shadow:inset 0 0 0 1px var(--rule)}

  .dialwrap{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:8px}
  .dial{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:300/272}
  .dial svg{width:100%;height:100%;display:block}
  .dial .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4%}
  .dial .val{font:600 clamp(60px,10vw,108px)/.9 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dial .unit{font:500 18px var(--num);color:var(--slate);margin-top:2px}
  .dial .live{font:500 15px var(--num);color:var(--slate);margin-top:10px;font-variant-numeric:tabular-nums}
  .dial .live.run{color:var(--run)}
  .step{height:76px;border-radius:50%;background:var(--steel);font:500 40px/1 var(--num);display:grid;place-items:center}
  .step:active{background:var(--ink);color:#fff}
  .slider{width:100%;margin:6px 0 0;accent-color:var(--ink);height:32px}
  .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px solid var(--rule);font-size:15px;color:var(--slate)}
  .facts strong{color:var(--ink);font-weight:700}

  .tq{display:grid;grid-template-columns:1fr auto;gap:16px;height:100%}
  .tq>div:first-child{display:flex;flex-direction:column}
  .tq>div:last-child{display:flex;flex-direction:column}
  .tq h2{font:700 17px var(--txt);margin:0 0 4px}
  .tq .val{font:600 72px/.95 var(--num);font-variant-numeric:tabular-nums}
  .tq .unit{font:500 17px var(--num);color:var(--slate)}
  .tq .btns{display:flex;gap:10px;margin:16px 0 18px}
  .tq .btns .step{width:76px}
  .meter{display:flex;flex-direction:column-reverse;gap:5px;width:46px;flex:1;min-height:220px;padding:4px 0}
  .meter i{flex:1;border-radius:5px;background:var(--steel)}
  .meter i.on{background:var(--run)} .meter i.on.hi{background:var(--warn)} .meter i.on.max{background:var(--stop)}
  .meterlbl{font-size:13px;color:var(--slate);text-align:center;margin-top:6px}
  .state{margin-top:auto;padding:12px 14px;border-radius:14px;background:var(--steel);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .state.run{background:var(--run);color:#fff}
  .state small{font-weight:400;opacity:.85;font-size:14px}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;color:var(--slate);font-size:13px;flex-wrap:wrap}
  .foot nav{display:flex;gap:16px}
  .foot button{background:none;color:var(--slate);text-decoration:underline;padding:4px 0;font-size:13px}
  .foot a{color:var(--slate);padding:4px 0}

  dialog{border:0;border-radius:20px;padding:18px;width:min(720px,94vw);max-height:80vh}
  dialog::backdrop{background:#17202b66}
  #log{font:12px/1.45 ui-monospace,Menlo,monospace;height:50vh;overflow:auto;background:var(--steel);border-radius:12px;padding:10px;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
  .l-out{color:#8a5a00} .l-in{color:#1d5fa8} .l-sys{color:var(--slate)} .l-new{color:#1d7a47;font-weight:700}

  .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.18s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--stop)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="conn" role="status" aria-live="polite">
    <span class="led" id="led"></span>
    <b id="stat">Neconectat</b>
    <span id="fw"></span>
  </div>
  <button class="pill" id="btnDisc" hidden>Deconectează</button>
  <button class="pill primary" id="btnConn">Conectează motorul</button>
</header>

<nav class="progs" id="progs" aria-label="Programe"></nav>

<main class="main">
  <section class="panel" aria-label="Viteză">
    <div class="dialwrap">
      <button class="step" data-sp="-50" aria-label="Scade viteza cu 50">−</button>
      <div class="dial">
        <svg viewBox="0 0 300 272" aria-hidden="true">
          <circle cx="150" cy="150" r="128" fill="none" stroke="#E3E8EB" stroke-width="16" pathLength="100" stroke-dasharray="75 100" stroke-linecap="round" transform="rotate(135 150 150)"/>
          <circle id="arcSet" cx="150" cy="150" r="128" fill="none" stroke="#17202B" stroke-width="16" pathLength="100" stroke-dasharray="0 100" stroke-linecap="round" transform="rotate(135 150 150)" style="transition:stroke-dasharray .2s"/>
          <circle cx="150" cy="150" r="104" fill="none" stroke="#EEF1F3" stroke-width="6" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 150 150)"/>
          <circle id="arcLoad" cx="150" cy="150" r="104" fill="none" stroke="#2FA866" stroke-width="6" pathLength="100" stroke-dasharray="0 100" transform="rotate(135 150 150)" style="transition:stroke-dasharray .3s"/>
          <text x="60" y="270" text-anchor="middle" font-family="Saira Semi Condensed, sans-serif" font-size="15" fill="#66727E">100</text>
          <text x="240" y="270" text-anchor="middle" font-family="Saira Semi Condensed, sans-serif" font-size="15" fill="#66727E">500</text>
        </svg>
        <div class="read">
          <div class="val" id="spV">–</div>
          <div class="unit">rpm</div>
          <div class="live" id="lSpeed">motorul nu e conectat</div>
        </div>
      </div>
      <button class="step" data-sp="50" aria-label="Crește viteza cu 50">+</button>
    </div>
    <input class="slider" type="range" id="spR" min="100" max="500" step="10" aria-label="Viteză">
    <div class="facts">
      <span>Mod <strong id="mMode">–</strong></span>
      <span>Unghiuri <strong id="mAng">–</strong></span>
      <span id="mFile"></span>
    </div>
  </section>

  <section class="panel" aria-label="Torque și sarcină">
    <div class="tq">
      <div>
        <h2>Torque</h2>
        <div><span class="val" id="tqV">–</span> <span class="unit">N·cm</span></div>
        <div class="btns">
          <button class="step" data-tq="-1" aria-label="Scade torque">−</button>
          <button class="step" data-tq="1" aria-label="Crește torque">+</button>
        </div>
        <div class="state" id="state"><span id="stateMain">Oprit</span> <small id="stateSub">pornește de pe motor</small></div>
      </div>
      <div>
        <div class="meter" id="meter" aria-label="Sarcină"></div>
        <div class="meterlbl">Sarcină</div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>Butonul S de pe motor trece la programul următor.</span>
  <nav>
    <button id="btnReset">Revino la programele din Denjoy</button>
    <button id="btnLog">Jurnal</button>
    <a href="lab.html">Analizor</a>
  </nav>
</footer>

<dialog id="dlg">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap">
    <b>Jurnal de comunicare</b>
    <span><label style="font-size:14px;color:var(--slate)"><input type="checkbox" id="showStatus"> pachete de stare</label>
    <button class="pill" id="btnSave" style="margin-left:8px">Salvează</button>
    <button class="pill" id="btnClose">Închide</button></span>
  </div>
  <div id="log"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== PROTOCOL DY-Meta Motor (din captura aplicației Denjoy, 26.11.2026) =====================
 Serviciu FF00 · FF01 = notify (motor → iPad) · FF02 = write (iPad → motor), Write Request
 Cadru: 55 AA | LEN(total) | CMD | date | CHK (suma tuturor octeților anteriori & 0xFF)
 iPad → motor:
   0C 00 cere programul curent → 0C + 16 octeți · 0A setări · 03 / 02 versiune FW / HW (ASCII)
   0B + 16 octeți setează programul → ACK 55 AA 05 0B 0F
     [0] program 1–6 [1] ac din bibliotecă [2] sistem ace [3] nr. ac [4] flag-uri [5] mod (0 REC, 3 ATC)
     [6–7] viteză LE [8–9] unghi înainte [10–11] unghi înapoi [12] torque ×0.1 [13] acțiune la torque [14] ? [15] ?
 motor → iPad:
   12 (~1/s): [5] program−1 [6] stare 0/1 [7] sarcină 0–8 [8–9] viteză LE
   13 02 00: butonul S → aplicația trimite programul următor
*/
const SVC='0000ff00-0000-1000-8000-00805f9b34fb';
const U=s=>`0000${s}-0000-1000-8000-00805f9b34fb`;
const LS_PROGS='metamotor.programs.v1', LS_DEV='metamotor.device';
const DEFAULTS=[
 [1,1,0x2D,1,7,0, 0x5E,1, 0x96,0, 0x1E,0, 0x1E, 1,5,1],
 [2,0,0,0,   3,2, 0x2C,1, 0x96,0, 0x1E,0, 0x32, 3,5,1],
 [3,0,0,0,   7,0, 0x5E,1, 0x68,1, 0xB4,0, 0x14, 3,5,1],
 [4,0,0,0,   7,3, 0xC2,1, 0x68,1, 0xB4,0, 0x11, 4,5,1],
 [5,0,0,0,   7,4, 0x45,1, 0x68,1, 0xB4,0, 0x14, 1,0,1],
 [6,0,0,0,   7,1, 0xF4,1, 0x68,1, 0xB4,0, 0x32, 1,5,1],
];
// culorile ISO ale acelor endodontice: 15 alb, 20 galben, 25 roșu, 30 albastru, 35 verde, 40 negru
const ISO=['#F4F6F7','#F2C318','#D8453B','#2F6FD6','#2FA866','#17202B'];
const MODES={0:'reciproc',3:'ATC'};
const SP_MIN=100, SP_MAX=500, TQ_MIN=10, TQ_MAX=50; // intervale văzute în aplicația Denjoy

let progs=load(), cur=3;
let device=null, rxChar=null, txChar=null, userDisc=false;
let rx=[], lines=[], sendTimer=null, busy=Promise.resolve();
const $=id=>document.getElementById(id);
const H=b=>b.toString(16).padStart(2,'0').toUpperCase();
const hex=a=>Array.from(a).map(H).join(' ');
const chk=a=>a.reduce((s,b)=>s+b,0)&0xFF;
const ts=()=>{const d=new Date();return d.toTimeString().slice(0,8)+'.'+String(d.getMilliseconds()).padStart(3,'0');};

function load(){ try{ const p=JSON.parse(localStorage.getItem(LS_PROGS)); if(Array.isArray(p)&&p.length===6&&p.every(x=>Array.isArray(x)&&x.length===16)) return p; }catch(e){} return DEFAULTS.map(a=>a.slice()); }
function save(){ try{ localStorage.setItem(LS_PROGS, JSON.stringify(progs)); }catch(e){} }
function log(k,t){ const line=`${ts()} ${t}`; lines.push(line); const el=document.createElement('span'); el.className='l-'+k; el.textContent=line+'\n'; const L=$('log'); L.appendChild(el); if(L.childNodes.length>1500) L.removeChild(L.firstChild); L.scrollTop=L.scrollHeight; }
function toast(t,err){ const e=$('toast'); e.textContent=t; e.className='toast show'+(err?' err':''); clearTimeout(e._t); e._t=setTimeout(()=>e.className='toast',1500); }
function setConn(t,s){ $('stat').textContent=t; $('led').className='led'+(s?' '+s:''); }

/* ---------- interfață ---------- */
const spd=p=>p[6]|(p[7]<<8);
const frac=v=>Math.max(0,Math.min(1,(v-SP_MIN)/(SP_MAX-SP_MIN)));
const progEls=[];
ISO.forEach((c,i)=>{ const b=document.createElement('button'); b.className='prog'; b.style.setProperty('--iso',c);
  b.innerHTML=`<div class="n">P${i+1}</div><div class="s"></div>`; b.onclick=()=>selectProg(i,true); $('progs').appendChild(b); progEls.push(b); });
const meter=$('meter'); for(let i=0;i<8;i++) meter.appendChild(document.createElement('i'));

function render(){
  progs.forEach((p,i)=>{ progEls[i].classList.toggle('act',i===cur); progEls[i].setAttribute('aria-pressed',i===cur);
    progEls[i].querySelector('.s').innerHTML=`${spd(p)} rpm<span class="tqx">, ${(p[12]/10).toFixed(1)} N·cm</span>`; });
  const p=progs[cur];
  $('spV').textContent=spd(p); $('spR').value=spd(p);
  $('arcSet').setAttribute('stroke-dasharray',`${(75*frac(spd(p))).toFixed(2)} 100`);
  $('tqV').textContent=(p[12]/10).toFixed(1);
  $('mMode').textContent=MODES[p[5]]??`${p[5]}`;
  $('mAng').textContent=`${p[8]|(p[9]<<8)}° / ${p[10]|(p[11]<<8)}°`;
  $('mFile').innerHTML=p[1]?`Ac din bibliotecă <strong>nr. ${p[3]}</strong>`:'';
}
function selectProg(i,send){ cur=i; render(); const e=progEls[i]; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); if(send) sendProg(); }
function change(fn){ fn(progs[cur]); save(); render(); scheduleSend(); }
const setSpeed=(p,v)=>{ v=Math.min(SP_MAX,Math.max(SP_MIN,Math.round(v/10)*10)); p[6]=v&255; p[7]=v>>8; };
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>change(p=>setSpeed(p,spd(p)+ +b.dataset.sp)));
document.querySelectorAll('[data-tq]').forEach(b=>b.onclick=()=>change(p=>{ p[12]=Math.min(TQ_MAX,Math.max(TQ_MIN,p[12]+ +b.dataset.tq)); }));
$('spR').oninput=e=>change(p=>setSpeed(p,+e.target.value));
$('btnReset').onclick=()=>{ if(confirm('Revii la valorile programelor din aplicația Denjoy?')){ progs=DEFAULTS.map(a=>a.slice()); save(); render(); if(txChar) sendProg(); } };
$('btnLog').onclick=()=>$('dlg').showModal();
$('btnClose').onclick=()=>$('dlg').close();

/* ---------- trimitere ---------- */
function frame(cmd,data){ const f=[0x55,0xAA,data.length+5,cmd,...data]; f.push(chk(f)); return new Uint8Array(f); }
function write(bytes){
  busy=busy.then(async()=>{ if(!txChar) return;
    try{ if(txChar.properties.write) await txChar.writeValueWithResponse(bytes); else await txChar.writeValueWithoutResponse(bytes); log('out','→ '+hex(bytes)); }
    catch(e){ log('sys','Scriere eșuată: '+e.message); toast('Motorul nu a primit setarea',true); }
  }); return busy;
}
function scheduleSend(){ clearTimeout(sendTimer); sendTimer=setTimeout(sendProg,250); }
function sendProg(){ if(!txChar){ toast('Conectează motorul ca să trimiți setarea',true); return; } const p=progs[cur].slice(); p[0]=cur+1; write(frame(0x0B,p)); }

/* ---------- conectare ---------- */
async function tryKnown(){
  if(!navigator.bluetooth?.getDevices) return false;
  try{ const list=await navigator.bluetooth.getDevices(); const want=localStorage.getItem(LS_DEV);
       const d=list.find(x=>x.name===want)||list.find(x=>(x.name||'').startsWith('DY-Meta'));
       if(!d) return false; await useDevice(d); return true; }catch(e){ return false; }
}
$('btnConn').onclick=async()=>{
  if(!navigator.bluetooth){ alert('Deschide pagina în aplicația Bluefy.'); return; }
  if(device&&!device.gatt.connected){ userDisc=false; try{ await connect(); return; }catch(e){} }
  if(await tryKnown()) return;
  try{ await useDevice(await navigator.bluetooth.requestDevice({filters:[{namePrefix:'DY-'},{services:[SVC]}],optionalServices:[SVC]})); }
  catch(e){ log('sys','Anulat: '+e.message); }
};
async function useDevice(d){
  if(device&&device!==d){ try{device.gatt.disconnect();}catch(e){} }
  device=d; userDisc=false; if(d.name) localStorage.setItem(LS_DEV,d.name);
  d.removeEventListener('gattserverdisconnected',onDisc); d.addEventListener('gattserverdisconnected',onDisc);
  await connect();
}
async function connect(){
  setConn('Se conectează…','wait');
  const server=await device.gatt.connect();
  const svc=await server.getPrimaryService(SVC);
  rxChar=await svc.getCharacteristic(U('ff01')); txChar=await svc.getCharacteristic(U('ff02'));
  rxChar.removeEventListener('characteristicvaluechanged',onNotify); rxChar.addEventListener('characteristicvaluechanged',onNotify);
  await rxChar.startNotifications();
  rx=[]; busy=Promise.resolve();
  setConn(device.name||'Meta Motor','on'); $('btnDisc').hidden=false; $('btnConn').hidden=true;
  log('sys','== CONECTAT');
  write(frame(0x0C,[0x00])); write(frame(0x0A,[])); write(frame(0x03,[])); write(frame(0x02,[]));
}
function onDisc(){
  txChar=null; $('btnDisc').hidden=true; $('btnConn').hidden=false; $('btnConn').textContent='Reconectează';
  setConn('Deconectat',''); $('lSpeed').textContent='motorul nu e conectat'; $('lSpeed').className='live'; setRunning(false,0); log('sys','== DECONECTAT');
  if(!userDisc&&device) reconnect(1);
}
async function reconnect(n){
  if(userDisc) return; if(n>15){ setConn('Deconectat',''); return; }
  setConn(`Se reconectează (${n})…`,'wait'); await new Promise(r=>setTimeout(r,Math.min(400*n,3000)));
  try{ await connect(); }catch(e){ reconnect(n+1); }
}
$('btnDisc').onclick=()=>{ userDisc=true; device?.gatt.disconnect(); };

/* ---------- recepție ---------- */
function onNotify(ev){
  const v=ev.target.value; rx.push(...new Uint8Array(v.buffer,v.byteOffset,v.byteLength));
  while(rx.length>=4){
    const i=rx.findIndex((b,k)=>b===0x55&&rx[k+1]===0xAA);
    if(i<0){ rx=rx.slice(-1); return; } if(i>0) rx=rx.slice(i);
    if(rx.length<3) return; const L=rx[2];
    if(L<5||L>64){ rx=rx.slice(2); continue; } if(rx.length<L) return;
    const f=rx.slice(0,L); rx=rx.slice(L);
    if(chk(f.slice(0,-1))!==f[L-1]){ log('sys','checksum greșit '+hex(f)); continue; }
    handle(f);
  }
}
function setRunning(on,load){
  $('state').className='state'+(on?' run':'');
  $('stateMain').textContent=on?'Rulează':'Oprit';
  $('stateSub').textContent=on?`sarcină ${load} din 8`:'pornește de pe motor';
  [...meter.children].forEach((x,i)=>x.className=i<load?'on'+(i>=6?' max':i>=4?' hi':''):'');
  $('arcLoad').setAttribute('stroke',load>=7?'#D8453B':load>=5?'#E8A317':'#2FA866');
  $('arcLoad').setAttribute('stroke-dasharray',`${(75*load/8).toFixed(2)} 100`);
}
function handle(f){
  const cmd=f[3], d=f.slice(4,-1);
  if(cmd===0x12){
    if($('showStatus').checked) log('in','← '+hex(f));
    $('lSpeed').textContent=`pe motor: P${f[5]+1}, ${f[8]|(f[9]<<8)} rpm`;
    $('lSpeed').className='live'+(f[6]===1?' run':'');
    setRunning(f[6]===1,f[7]);
    return;
  }
  log('in','← '+hex(f));
  if(cmd===0x0B) toast(`P${cur+1} setat pe motor`);
  else if(cmd===0x0C&&d.length===16){ const n=d[0]-1; if(n>=0&&n<6){ progs[n]=d.slice(); progs[n][0]=n+1; cur=n; save(); render(); } }
  else if(cmd===0x03) $('fw').textContent='firmware '+String.fromCharCode(...d);
  else if(cmd===0x13&&d[0]===0x02){ log('new','Buton S → program următor'); selectProg((cur+1)%6,true); }
}
$('btnSave').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'})); a.download=`metamotor-${Date.now()}.txt`; a.click(); };

render();
if(navigator.bluetooth) tryKnown();
</script>
